[pytest]
# Pytest configuration for LightRAG

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Output options
addopts =
    # Show verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Enable strict markers
    --strict-markers
    # Show warnings
    -W default
    # Coverage options (if pytest-cov is installed)
    --cov=lightrag
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    # Fail if coverage is below threshold
    --cov-fail-under=0

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests requiring external services
    slow: Slow-running tests
    asyncio: Tests using asyncio
    storage: Tests for storage backends
    llm: Tests requiring LLM access
    embedding: Tests requiring embedding models

# Asyncio configuration
asyncio_mode = auto

# Minimum Python version
minversion = 3.10

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Console output format
console_output_style = progress

# Log format
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
# Requires pytest-timeout
# timeout = 300

# Parallel execution
# Requires pytest-xdist
# addopts = -n auto
