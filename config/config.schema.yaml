# LightRAG 快速实体提取器（8-15倍速度提升）配置 Schema
#
# 此文件定义配置字段的元数据，包括：
# - 字段路径（section）
# - 默认值（default）
# - 类型（type: 留空为自动推断，secret 为密钥）
# - 自动生成（auto_generate: 密钥自动生成）
# - 描述（description）
#
# 运行 ./scripts/setup.sh 自动生成 config/local.yaml 和 .env

# ============================================================
# 快速实体提取器配置
# ============================================================

# 通用配置
- section: trilingual.enabled
  default: true
  description: "Enable fast entity extractor (8-15x faster than LLM) (Chinese/English/Swedish)"

- section: trilingual.default_language
  default: "en"
  description: "Default language if not specified (zh/en/sv)"

- section: trilingual.lazy_loading
  default: true
  description: "Enable lazy loading (load models on-demand to save memory)"

# 中文配置（HanLP）
- section: trilingual.chinese.enabled
  default: true
  description: "Enable Chinese entity extraction (HanLP)"

- section: trilingual.chinese.model
  default: "CLOSE_TOK_POS_NER_SRL_DEP_SDP_CON_ELECTRA_BASE_ZH"
  description: "HanLP model name for Chinese"

- section: trilingual.chinese.cache_dir
  default: ""
  description: "HanLP model cache directory (empty = default ~/.hanlp)"

# 英文配置（spaCy）
- section: trilingual.english.enabled
  default: true
  description: "Enable English entity extraction (spaCy)"

- section: trilingual.english.model
  default: "en_core_web_trf"
  description: "spaCy model name for English (en_core_web_trf/en_core_web_lg/en_core_web_sm)"

- section: trilingual.english.batch_size
  default: 32
  description: "spaCy batch size for English processing"

# 瑞典语配置（spaCy）
- section: trilingual.swedish.enabled
  default: true
  description: "Enable Swedish entity extraction (spaCy)"

- section: trilingual.swedish.model
  default: "sv_core_news_lg"
  description: "spaCy model name for Swedish (sv_core_news_lg/sv_core_news_md/sv_core_news_sm)"

- section: trilingual.swedish.batch_size
  default: 32
  description: "spaCy batch size for Swedish processing"

# 性能配置
- section: trilingual.performance.max_text_length
  default: 1000000
  description: "Maximum text length to process (characters)"

- section: trilingual.performance.enable_gpu
  default: false
  description: "Enable GPU acceleration if available"

- section: trilingual.performance.num_threads
  default: 4
  description: "Number of threads for parallel processing"

# 缓存配置
- section: trilingual.cache.enabled
  default: true
  description: "Enable result caching"

- section: trilingual.cache.ttl
  default: 3600
  description: "Cache TTL in seconds (0 = no expiry)"

- section: trilingual.cache.max_size
  default: 1000
  description: "Maximum number of cached results"

# 日志配置
- section: trilingual.logging.level
  default: "INFO"
  description: "Logging level (DEBUG/INFO/WARNING/ERROR)"

- section: trilingual.logging.format
  default: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  description: "Logging format string"

# ============================================================
# LightRAG 通用配置示例
# ============================================================

# ============================================================
# 1. 服务层配置（对外接口）
# ============================================================

# API 密钥（自动生成）
- section: lightrag.api.secret_key
  type: secret
  auto_generate: true
  description: "API secret key (auto-generated, 32 characters)"

# API 配置
- section: lightrag.api.host
  default: "0.0.0.0"
  description: "API server host"

- section: lightrag.api.port
  default: 9621
  description: "API server port"

- section: lightrag.api.debug
  default: false
  description: "Enable debug mode"

# 安全配置
- section: lightrag.security.enable_api_key
  default: false
  description: "Require API key for requests"

- section: lightrag.security.allowed_origins
  default: "*"
  description: "CORS allowed origins (comma-separated)"

- section: lightrag.security.rate_limit
  default: 100
  description: "API rate limit (requests per minute per IP)"

# ============================================================
# 2. 模型层配置（AI 核心）
# ============================================================

# LLM 配置（分层结构：每个 provider 独立配置块）
- section: lightrag.llm.provider
  default: "ollama"
  description: "LLM provider selection (ollama/openai/azure_openai/anthropic/gemini/aws_bedrock)"

# LLM - OpenAI 配置
- section: lightrag.llm.openai.model
  default: "gpt-4o-mini"
  description: "OpenAI model name"

- section: lightrag.llm.openai.api_key
  type: secret
  auto_generate: false
  description: "OpenAI API key"

- section: lightrag.llm.openai.base_url
  default: ""
  description: "OpenAI base URL (optional, for custom endpoints)"

- section: lightrag.llm.openai.max_tokens
  default: 4096
  description: "OpenAI max tokens"

- section: lightrag.llm.openai.temperature
  default: 0.0
  description: "OpenAI temperature (0.0-1.0)"

# LLM - Ollama 配置
- section: lightrag.llm.ollama.model
  default: "mistral-nemo:latest"
  description: "Ollama model name"

- section: lightrag.llm.ollama.host
  default: "http://localhost:11434"
  description: "Ollama server host"

- section: lightrag.llm.ollama.max_tokens
  default: 4096
  description: "Ollama max tokens"

- section: lightrag.llm.ollama.temperature
  default: 0.0
  description: "Ollama temperature (0.0-1.0)"

- section: lightrag.llm.ollama.num_ctx
  default: 32768
  description: "Ollama context window size"

# LLM - Azure OpenAI 配置
- section: lightrag.llm.azure_openai.model
  default: "gpt-4"
  description: "Azure OpenAI model name"

- section: lightrag.llm.azure_openai.api_key
  type: secret
  auto_generate: false
  description: "Azure OpenAI API key"

- section: lightrag.llm.azure_openai.endpoint
  default: ""
  description: "Azure OpenAI endpoint URL"

- section: lightrag.llm.azure_openai.deployment
  default: ""
  description: "Azure OpenAI deployment name"

- section: lightrag.llm.azure_openai.max_tokens
  default: 4096
  description: "Azure OpenAI max tokens"

- section: lightrag.llm.azure_openai.temperature
  default: 0.0
  description: "Azure OpenAI temperature (0.0-1.0)"

# LLM - Anthropic 配置
- section: lightrag.llm.anthropic.model
  default: "claude-3-sonnet-20240229"
  description: "Anthropic model name"

- section: lightrag.llm.anthropic.api_key
  type: secret
  auto_generate: false
  description: "Anthropic API key"

- section: lightrag.llm.anthropic.max_tokens
  default: 4096
  description: "Anthropic max tokens"

- section: lightrag.llm.anthropic.temperature
  default: 0.0
  description: "Anthropic temperature (0.0-1.0)"

# LLM - Gemini 配置
- section: lightrag.llm.gemini.model
  default: "gemini-pro"
  description: "Gemini model name"

- section: lightrag.llm.gemini.api_key
  type: secret
  auto_generate: false
  description: "Gemini API key"

- section: lightrag.llm.gemini.max_tokens
  default: 4096
  description: "Gemini max tokens"

- section: lightrag.llm.gemini.temperature
  default: 0.0
  description: "Gemini temperature (0.0-1.0)"

# Embedding 配置（分层结构）
- section: lightrag.embedding.provider
  default: "ollama"
  description: "Embedding provider selection (ollama/openai/azure_openai/jina/gemini)"

# Embedding - Ollama 配置
- section: lightrag.embedding.ollama.model
  default: "bge-m3:latest"
  description: "Ollama embedding model name"

- section: lightrag.embedding.ollama.host
  default: "http://localhost:11434"
  description: "Ollama server host"

- section: lightrag.embedding.ollama.dimension
  default: 1024
  description: "Ollama embedding dimension"

# Embedding - OpenAI 配置
- section: lightrag.embedding.openai.model
  default: "text-embedding-3-small"
  description: "OpenAI embedding model name"

- section: lightrag.embedding.openai.api_key
  type: secret
  auto_generate: false
  description: "OpenAI API key"

- section: lightrag.embedding.openai.base_url
  default: ""
  description: "OpenAI base URL (optional)"

- section: lightrag.embedding.openai.dimension
  default: 1536
  description: "OpenAI embedding dimension"

# Embedding - Jina 配置
- section: lightrag.embedding.jina.model
  default: "jina-embeddings-v2-base-en"
  description: "Jina embedding model name"

- section: lightrag.embedding.jina.api_key
  type: secret
  auto_generate: false
  description: "Jina API key"

- section: lightrag.embedding.jina.dimension
  default: 768
  description: "Jina embedding dimension"

# Rerank 配置（分层结构）
- section: lightrag.rerank.provider
  default: "null"
  description: "Rerank provider selection (null/cohere/jina/aliyun)"

# Rerank - Cohere 配置
- section: lightrag.rerank.cohere.model
  default: "rerank-english-v2.0"
