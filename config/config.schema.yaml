  default: "gte-rerank"
  description: "Aliyun rerank model name"

- section: lightrag.rerank.aliyun.api_key
  type: secret
  auto_generate: false
  description: "Aliyun API key"

# ============================================================
# 3. 处理层配置（数据处理流程）
# ============================================================

# 分块配置
- section: lightrag.chunking.chunk_size
  default: 1200
  description: "Text chunk size (characters)"

- section: lightrag.chunking.chunk_overlap_size
  default: 100
  description: "Chunk overlap size (characters)"

# 实体提取配置
- section: lightrag.entity_extraction.max_gleaning
  default: 1
  description: "Entity extraction gleaning rounds (0=disabled, 1=enabled)"

- section: lightrag.entity_extraction.use_trilingual
  default: false
  description: "Use trilingual extractor instead of LLM (requires setup)"

- section: lightrag.entity_extraction.auto_detect_language
  default: true
  description: "Auto-detect document language for trilingual extractor"

- section: lightrag.entity_extraction.fallback_to_llm
  default: true
  description: "Fallback to LLM extraction if trilingual fails or unsupported language"

- section: lightrag.entity_extraction.default_language
  default: "en"
  description: "Default language for trilingual extractor if auto-detect disabled (zh/en/sv)"

# 关系提取配置
- section: lightrag.relation_extraction.enabled
  default: true
  description: "Enable relation extraction"

- section: lightrag.relation_extraction.method
  default: "llm"
  description: "Relation extraction method (llm/pattern/hybrid)"

# Summary 配置
- section: lightrag.summary.language
  default: "English"
  description: "Summary language for entity/relation descriptions (English/Chinese/etc)"

# ============================================================
# 4. 存储层配置（持久化）
# ============================================================

# 存储配置
- section: lightrag.storage.kv_storage
  default: "JsonKVStorage"
  description: "KV storage type (JsonKVStorage/PGKVStorage/RedisKVStorage/MongoKVStorage)"

- section: lightrag.storage.vector_storage
  default: "NanoVectorDBStorage"
  description: "Vector storage type (NanoVectorDBStorage/PGVectorStorage/MilvusVectorDBStorage/QdrantStorage/ChromaVectorDBStorage)"

- section: lightrag.storage.graph_storage
  default: "NetworkXStorage"
  description: "Graph storage type (NetworkXStorage/Neo4JStorage/PGGraphStorage/MemgraphStorage)"

- section: lightrag.storage.doc_status_storage
  default: "JsonDocStatusStorage"
  description: "Document status storage type (JsonDocStatusStorage/PGDocStatusStorage/MongoDocStatusStorage)"

# 数据库配置
- section: lightrag.database.type
  default: "sqlite"
  description: "Database type (sqlite/postgres/mysql)"

- section: lightrag.database.path
  default: "./data/lightrag.db"
  description: "Database file path (for SQLite)"

# 向量数据库配置
- section: lightrag.vector_db.type
  default: "nano"
  description: "Vector database type (nano/milvus/qdrant/chroma)"

- section: lightrag.vector_db.dimension
  default: 1536
  description: "Vector dimension"

# ============================================================
# 5. 优化层配置（性能调优）
# ============================================================

# 查询配置
- section: lightrag.query.top_k
  default: 60
  description: "Top-K entities/relations to retrieve"

- section: lightrag.query.chunk_top_k
  default: 5
  description: "Top-K text chunks to retrieve"

- section: lightrag.query.max_entity_tokens
  default: 12000
  description: "Maximum entity tokens in context"

- section: lightrag.query.max_relation_tokens
  default: 12000
  description: "Maximum relation tokens in context"

- section: lightrag.query.max_total_tokens
  default: 40000
  description: "Maximum total tokens in context"

# LLM 缓存配置
- section: lightrag.cache.enable_llm_cache
  default: true
  description: "Enable LLM response caching"

- section: lightrag.cache.enable_llm_cache_for_extract
  default: true
  description: "Enable LLM cache for entity extraction"

# 性能配置
- section: lightrag.performance.max_async
  default: 4
  description: "Maximum concurrent LLM requests"

- section: lightrag.performance.max_parallel_insert
  default: 2
  description: "Maximum parallel document processing"
